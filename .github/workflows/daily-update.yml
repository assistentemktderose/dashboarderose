name: Daily Dashboard Update

on:
  schedule:
    # Executa todos os dias às 8h (UTC-3 = 11h em UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client
      
      - name: Run dashboard update script
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          python script.py
      
      - name: Commit and push changes
        run: |
          git config --global user.name "Dashboard Bot"
          git config --global user.email "dashboard@derose.local"
          git add dados.json
          git commit -m "chore: update dashboard data at $(date)" || echo "No changes to commit"
          git push
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
